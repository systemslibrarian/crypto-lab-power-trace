name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the no-checkout deploy job may publish. `build` runs repository code and
# its own steps need no write scope: `upload-pages-artifact` requires none, and
# `configure-pages` only reads the Pages configuration here -- its output is not
# consumed by anything in this workflow.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The gate, called rather than copied -- the same file the Dependabot
  # auto-merge waits on, so what merges a bump and what publishes it are
  # one definition and cannot drift apart.
  gate:
    uses: ./.github/workflows/gate.yml

  build:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (typecheck gates the build)
        run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: [gate, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
